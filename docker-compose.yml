services:
  voice-optimizer:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - backend/.env
    environment:
      - APP_URL=${APP_URL:-http://localhost:3001}
      - NODE_ENV=production
    volumes:
      - optimizer-data:/app/backend/data
      - optimizer-logs:/app/backend/run_logs
    restart: unless-stopped

volumes:
  optimizer-data:
  optimizer-logs:
